name: .NET Core Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The .NET 10 SDK builds both targets; install .NET 8 as well for its test host.
      - name: Install .NET SDKs
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Pin only this CI workspace, without changing the SDK policy for developers.
      - name: Select the installed .NET 10 SDK
        shell: pwsh
        run: |
          dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward disable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --info

      - name: Restore solution
        run: dotnet restore PathForge.sln -p:PathForgeNet10=true

      - name: Build solution
        id: build
        run: dotnet build PathForge.sln --configuration ${{ matrix.configuration }} --no-restore -p:PathForgeNet10=true

      # Separate steps keep the two test hosts from competing on the same runner
      # and produce independent results, even if one framework's tests fail.
      - name: Test .NET 8
        run: >-
          dotnet test tests/PathForge.Core.Tests/PathForge.Core.Tests.csproj
          --configuration ${{ matrix.configuration }} --framework net8.0
          --no-build --no-restore -p:PathForgeNet10=true
          --logger "trx;LogFileName=net8.0.trx" --results-directory TestResults

      - name: Test .NET 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/PathForge.Core.Tests/PathForge.Core.Tests.csproj
          --configuration ${{ matrix.configuration }} --framework net10.0
          --no-build --no-restore -p:PathForgeNet10=true
          --logger "trx;LogFileName=net10.0.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults/*.trx
          if-no-files-found: warn

      # Ordinary WPF build output; no MSIX packaging project or signing secrets required.
      - name: Upload application build
        uses: actions/upload-artifact@v4
        with:
          name: PathForge-${{ matrix.configuration }}
          path: |
            src/PathForge.App/bin/${{ matrix.configuration }}/net8.0-windows/
            src/PathForge.App/bin/${{ matrix.configuration }}/net10.0-windows/
          if-no-files-found: error
