<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PathForge icon: a toolpath forged into a plate by an end mill (source of PathForge.ico) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4C7E"/>
      <stop offset="1" stop-color="#14243F"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9AAB"/>
      <stop offset="0.45" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#7A8698"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#plate)"/>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="none" stroke="#5B7FB8" stroke-width="4" stroke-opacity="0.5"/>
  <!-- The toolpath: a bold zigzag ending at the cutter -->
  <path d="M44 196 L44 120 L92 168 L92 92 L140 140 L140 76" fill="none" stroke="#0B1526" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M44 196 L44 120 L92 168 L92 92 L140 140 L140 76" fill="none" stroke="url(#path)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparks where the cutter works -->
  <circle cx="140" cy="76" r="34" fill="url(#glow)"/>
  <!-- End mill seen from the side, tilted towards the path -->
  <g transform="rotate(32 168 72)">
    <rect x="152" y="-6" width="32" height="54" rx="5" fill="url(#steel)" stroke="#3D4757" stroke-width="3"/>
    <path d="M154 48 L182 48 L182 96 Q168 108 154 96 Z" fill="url(#steel)" stroke="#3D4757" stroke-width="3"/>
    <path d="M155 58 L181 70 M155 74 L181 86 M157 90 L178 99" stroke="#4A5566" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
